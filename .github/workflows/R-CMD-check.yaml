name: Windows release diagnostics

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MAKEFLAGS: '-j2'
  _R_CHECK_LIMIT_CORES_: 'true'

jobs:
  windows-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.2'
          Ncpus: '2'
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          dependencies: '"all"'
          install-quarto: false
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source-archive
          path: source-archive
          run-id: 43918334854
          github-token: ${{ github.token }}
      - name: Diagnose three Windows test files from the published archive
        run: Rscript --vanilla validation/windows_release_probe.R
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-diagnostics
          path: windows-diagnostic/
          retention-days: 3
          if-no-files-found: error
